name: CI · Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded PR builds, but never cut off a deployment halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, so a new release cannot change a build without a commit. Vite and vue-tsc run on Node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      - name: Test
        run: bun test

      - name: Type-check and build
        run: bun run build

      - name: Smoke test in a browser
        run: |
          bunx playwright install --with-deps --only-shell chromium
          bunx playwright test

      # No routes in the app: any unknown path still opens it.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
