<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="時間計算機：開始 + 間隔 = 結束。時區對照、月曆、倒數、時長運算與各種時間格式，一個畫面看完。" />
    <meta name="theme-color" content="#E9ECF2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060910" media="(prefers-color-scheme: dark)" />
    <title>時間計算機</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='9' fill='%232B44D6'/%3E%3Ccircle cx='9.5' cy='16' r='3.6' fill='%23fff'/%3E%3Cpath d='M13.6 16h4.8' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' opacity='.7'/%3E%3Ccircle cx='22.5' cy='16' r='3' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Martian+Mono:wdth,wght@75..100,400..600&family=Noto+Sans+TC:wght@400..700&display=swap" />
    <script>
      try { var t = JSON.parse(localStorage.getItem('time-calculator:v2') || 'null'); if (t && (t.theme === 'light' || t.theme === 'dark')) document.documentElement.dataset.theme = t.theme; if (t && typeof t.density === 'number' && t.density >= 80 && t.density <= 116) document.documentElement.style.setProperty('--density', String(t.density / 100)); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>時間計算機需要 JavaScript。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
